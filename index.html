<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設計工單 Dashboard</title>
<style>
:root {
  --primary:#1A56DB; --primary-dark:#1343B0; --primary-bg:#EEF4FF; --primary-mid:#B4C6F5;
  --ec:#1A56DB; --ec-bg:#EEF4FF;
  --mkt:#0E9F6E; --mkt-bg:#E8F8F2;
  --danger:#C81E1E; --danger-bg:#FDF2F2;
  --warn:#92550A; --warn-bg:#FEF5E7;
  --done:#0E6B4A; --done-bg:#E8F8F2;
  --proof:#7A5C00; --proof-bg:#FEFCE8;
  --neutral:#4B5563; --neutral-bg:#F3F4F6;
  --text:#111928; --text2:#4B5563; --text3:#8A919E;
  --border:#E5E7EB; --surface:#F7F8FA; --white:#FFF;
  --r:10px; --r-sm:6px; --pill:100px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;background:var(--surface);color:var(--text);min-height:100vh;font-variant-numeric:tabular-nums}
.page{max-width:1180px;margin:0 auto;padding:2rem 1.5rem 3rem}
button,select,input{font:inherit}

/* Topbar */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:1.25rem}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--text3);margin-top:5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.leg{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.btn{font-size:12px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--white);color:var(--text);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface)}

/* Notices */
.demo-bar{background:var(--proof-bg);border:1px solid #F3E39B;color:var(--proof);border-radius:var(--r-sm);padding:9px 14px;font-size:12.5px;margin-bottom:12px;display:none}
.alert-bar{display:none;flex-wrap:wrap;gap:6px 18px;background:var(--danger-bg);border:1px solid #FCA5A5;border-radius:var(--r-sm);padding:10px 16px;margin-bottom:1.25rem;font-size:13px;color:var(--danger);font-weight:500}
.alert-bar a{color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.75rem}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.05rem 1.2rem;cursor:pointer;transition:border-color .15s}
.stat-card:hover{border-color:var(--primary-mid)}
.stat-card.hl{border-color:var(--primary-mid);background:var(--primary-bg)}
.stat-label{font-size:12px;color:var(--text3);margin-bottom:8px;font-weight:500}
.stat-val{font-size:32px;font-weight:700;line-height:1;letter-spacing:-1px}
.stat-val small{font-size:15px;font-weight:600;letter-spacing:0;margin-left:6px;color:var(--text3)}
.c-primary{color:var(--primary)} .c-danger{color:var(--danger)} .c-warn{color:#B45309}
.stat-sub{font-size:11.5px;color:var(--text3);margin-top:8px;line-height:1.6}

/* Section */
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-title{font-size:12px;font-weight:700;color:var(--text2);letter-spacing:.06em}
.sec-note{font-size:11.5px;color:var(--text3)}

/* Designer cards */
.designer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:2rem}
.dcard{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.15rem 1.2rem;cursor:pointer;transition:border-color .15s}
.dcard:hover,.dcard.on{border-color:var(--primary)}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;background:var(--primary-bg);color:var(--primary);flex-shrink:0}
.dname{font-size:15px;font-weight:700}
.dmeta{font-size:11.5px;color:var(--text3);margin-top:2px}
.util{margin-left:auto;text-align:right}
.util-num{font-size:22px;font-weight:700;line-height:1}
.util-lbl{font-size:10.5px;color:var(--text3);margin-top:3px}
.loadbar{position:relative;display:flex;height:10px;background:#EEF0F3;border-radius:5px;overflow:hidden;margin:4px 0 6px}
.seg{height:100%}
.seg-res{background:repeating-linear-gradient(135deg,#C9CED6 0 4px,#E3E6EB 4px 8px)}
.seg-ec{background:var(--ec)} .seg-mkt{background:var(--mkt)}
.loadbar.over{box-shadow:0 0 0 2px var(--danger)}
.load-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--text3);margin-bottom:10px}
.load-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.drows{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:12px}
.drow{background:var(--surface);border-radius:var(--r-sm);padding:6px 4px;text-align:center}
.drow b{display:block;font-size:15px}
.drow span{font-size:10.5px;color:var(--text3)}
.dtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:var(--pill);font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-hot{background:var(--danger-bg);color:var(--danger);border:1px solid #FCA5A5}
.t-mid{background:var(--warn-bg);color:var(--warn);border:1px solid #FDE68A}
.t-ok{background:var(--done-bg);color:var(--done);border:1px solid #A7E3C9}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--text3)}

/* Table controls */
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-size:12px;padding:5px 12px;border-radius:var(--pill);border:1px solid var(--border);background:var(--white);color:var(--text2);cursor:pointer;font-weight:500}
.tab:hover:not(.on){background:var(--surface)}
.tab.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tab .n{opacity:.7;margin-left:3px}
.filters{display:flex;gap:6px}
.filters select,.filters input{font-size:12px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--white);color:var(--text)}
.filters input{width:160px}

.table-wrap{background:var(--white);border:1px solid var(--border);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:860px}
thead th{background:var(--primary-bg);padding:9px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--primary-dark);border-bottom:1px solid var(--primary-mid);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid #F1F2F4;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#FAFBFF}
tr.row-over td:first-child{box-shadow:inset 3px 0 0 var(--danger)}
tr.row-soon td:first-child{box-shadow:inset 3px 0 0 #F59E0B}
.tn{font-weight:600;color:var(--text)}
.ts{font-size:11px;color:var(--text3);margin-top:2px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--pill);font-weight:500;white-space:nowrap}
.b-ec{background:var(--ec-bg);color:var(--ec)} .b-mkt{background:var(--mkt-bg);color:var(--mkt)}
.b-wait{background:var(--neutral-bg);color:var(--neutral)} .b-prog{background:var(--primary-bg);color:var(--primary)}
.b-proof{background:var(--proof-bg);color:var(--proof)} .b-done{background:var(--done-bg);color:var(--done)}
.b-review{background:var(--danger-bg);color:var(--danger)} .b-pause{background:#EDEBFA;color:#5B4BB7}
.b-empty{background:#fff;color:var(--text3);border:1px dashed #D1D5DB}
.dl{white-space:nowrap;font-size:12px}
.dl.over{color:var(--danger);font-weight:700}
.dl.soon{color:#B45309;font-weight:600}
.dl .rel{font-size:10.5px;display:block;font-weight:500}
.dl2{font-size:10.5px;color:var(--text3);display:block;margin-top:2px}
.muted{color:#C3C7CF}
.empty td{text-align:center;padding:2.2rem;color:var(--text3)}

/* Data check */
details.check{margin-top:1.25rem;background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:0}
details.check summary{cursor:pointer;padding:11px 16px;font-size:12.5px;font-weight:600;color:var(--text2);list-style:none;display:flex;justify-content:space-between}
details.check summary::-webkit-details-marker{display:none}
details.check summary::after{content:'展開 ▾';font-weight:500;color:var(--text3);font-size:11.5px}
details.check[open] summary::after{content:'收合 ▴'}
.check-list{border-top:1px solid var(--border);max-height:320px;overflow:auto}
.check-item{display:grid;grid-template-columns:52px 70px 1fr auto;gap:10px;padding:7px 16px;font-size:12px;border-bottom:1px solid #F3F4F6;align-items:center}
.check-item:last-child{border-bottom:none}
.check-item .iss{color:#B45309;font-size:11.5px;text-align:right}

.foot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);margin-top:1.25rem;flex-wrap:wrap}
.api-dot{width:7px;height:7px;border-radius:50%;background:#F59E0B}
.api-dot.live{background:#10B981}

@media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr)}.designer-grid{grid-template-columns:1fr 1fr}.topbar{flex-direction:column}}
@media (max-width:560px){.page{padding:1rem}.stat-grid,.designer-grid{grid-template-columns:1fr}.stat-val{font-size:26px}.filters{width:100%}.filters input{flex:1}}
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div>
      <h1>設計工單 Dashboard</h1>
      <div class="sub">
        <span>電商 · 行銷素材｜自動彙整 Google Sheets</span>
        <span class="leg"><span class="dot" style="background:var(--ec)"></span>電商</span>
        <span class="leg"><span class="dot" style="background:var(--mkt)"></span>行銷</span>
      </div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="refreshData()">↺ 重新整理</button>
      <a class="btn" href="https://docs.google.com/spreadsheets/d/1Z3YHXWLPtjZ57cWMfaJstX9dtHdMkn309X0gKZUPl08/edit" target="_blank" rel="noopener" style="text-decoration:none">開啟試算表 ↗</a>
    </div>
  </div>

  <div class="demo-bar" id="demo-bar"></div>
  <div class="alert-bar" id="alert-bar"></div>

  <div class="stat-grid">
    <div class="stat-card hl" onclick="goTab('active')">
      <div class="stat-label">進行中工單</div>
      <div class="stat-val c-primary" id="s-active">—</div>
      <div class="stat-sub" id="s-active-sub"></div>
    </div>
    <div class="stat-card" onclick="goTab('review')">
      <div class="stat-label">待主管審核</div>
      <div class="stat-val c-danger" id="s-review">—</div>
      <div class="stat-sub" id="s-review-sub">需要你處理</div>
    </div>
    <div class="stat-card" onclick="goTab('due')">
      <div class="stat-label">已逾期 ／ 7 天內到期</div>
      <div class="stat-val c-warn" id="s-due">—</div>
      <div class="stat-sub" id="s-due-sub"></div>
    </div>
    <div class="stat-card" style="cursor:default">
      <div class="stat-label" id="s-month-lbl">本月完成</div>
      <div class="stat-val" id="s-month">—</div>
      <div class="stat-sub" id="s-month-sub"></div>
    </div>
  </div>

  <div class="sec-head">
    <div class="sec-title">設計師負載</div>
    <div class="sec-note" id="load-note"></div>
  </div>
  <div class="load-legend">
    <span><i style="background:repeating-linear-gradient(135deg,#C9CED6 0 3px,#E3E6EB 3px 6px)"></i>社群/其他保留</span>
    <span><i style="background:var(--ec)"></i>電商</span>
    <span><i style="background:var(--mkt)"></i>行銷</span>
    <span>· 點卡片可篩選該設計師工單</span>
  </div>
  <div class="designer-grid" id="designer-grid"></div>

  <div class="controls">
    <div class="tabs" id="tabs"></div>
    <div class="filters">
      <select id="f-designer" onchange="VIEW.designer=this.value;renderAll()"></select>
      <input id="f-q" type="search" placeholder="搜尋案件／品牌／版位" oninput="VIEW.q=this.value.trim();renderTable()">
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th>來源</th><th>案件</th><th>版位／工作項目</th><th>設計師</th>
        <th>主管審核</th><th>設計執行</th><th>預計提稿</th><th>截止日</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <details class="check" id="check"><summary id="check-sum">資料檢查</summary><div class="check-list" id="check-list"></div></details>

  <div class="foot">
    <span class="api-dot" id="api-dot"></span><span id="api-label">讀取中…</span>
    <span id="countdown" style="color:var(--primary)"></span>
    <span style="margin-left:auto" id="update-time"></span>
  </div>
</div>

<script>

const REFRESH_SEC = 300;          // 5 分鐘自動更新
const SOON_DAYS = 7;              // 幾天內算「即將到期」

/* ── 狀態 ── */
let DATA = null, IS_DEMO = false;
const VIEW = { tab:'active', designer:'all', q:'' };

/* ── 工具 ── */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const today0 = () => { const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
const md = s => { const d=pd(s); return d ? `${d.getMonth()+1}/${d.getDate()}` : ''; };
const daysTo = s => { const d=pd(s); return d ? Math.round((d-today0())/864e5) : null; };
const fmtPts = n => (Math.round(n*10)/10).toString();
const normType = s => String(s||'').replace(/[⭐\s]/g,'');

function weightOf(type, weights){
  const k = normType(type);
  const keys = Object.keys(weights);
  let hit = keys.find(x => normType(x) === k);
  if (!hit && k) hit = keys.find(x => normType(x) && (k.includes(normType(x)) || normType(x).includes(k)));
  return hit ? Number(weights[hit]) : (weights['其他'] ?? 1);
}

/* ── 資料整理（所有統計都在前端計算）── */
function prepare(data){
  const roster = data.config.designers.map(d => d.name);
  const canon = n => { const s=String(n||'').trim(); if(!s) return ''; return roster.find(r => r.toLowerCase()===s.toLowerCase()) || s; };
  data.tickets.forEach(t => {
    t.designerRaw = t.designer;
    t.designer = canon(t.designer);
    t.review = t.review || '待審核';
    t.exec = t.exec === '已完成' ? '已完稿' : (t.exec || '');
    t.isDone = t.exec === '已完稿';
    t.isPaused = t.review === '暫停';
    t.isActive = !t.isDone && !t.isPaused;
    const dates = [t.due, t.warehouse].filter(Boolean).sort();
    t.deadline = dates[0] || '';
    t.dleft = daysTo(t.deadline);
    t.dl = t.dleft===null ? 'none' : t.dleft<0 ? 'over' : t.dleft<=SOON_DAYS ? 'soon' : 'ok';
    t.weight = weightOf(t.type, data.config.weights);
  });
  data.done.forEach(d => d.designer = canon(d.designer));
  // 名單外的設計師也列出來，避免工單被漏算
  const extra = [...new Set(data.tickets.filter(t=>t.isActive && t.designer && !roster.includes(t.designer)).map(t=>t.designer))];
  data.roster = data.config.designers.map(d => ({...d, reserve:Number(d.reserve)||0})).concat(extra.map(n => ({name:n, reserve:0, extra:true})));
  return data;
}

/* ── 主渲染 ── */
function render(data, demo){
  DATA = prepare(data); IS_DEMO = demo;
  const T = DATA.tickets, active = T.filter(t=>t.isActive);
  const ec = active.filter(t=>t.src==='電商').length, mkt = active.length-ec;
  const review = T.filter(t=>t.review==='待審核' && !t.isDone);
  const over = active.filter(t=>t.dl==='over'), soon = active.filter(t=>t.dl==='soon');
  const now = today0();
  const monthDone = DATA.done.filter(d => { const x=pd(d.doneDate); return x && x.getFullYear()===now.getFullYear() && x.getMonth()===now.getMonth(); });

  set('s-active', active.length);
  set('s-active-sub', `電商 ${ec} · 行銷 ${mkt}　|　暫停 ${T.filter(t=>t.isPaused).length}`);
  set('s-review', review.length);
  set('s-review-sub', review.length ? `其中 ${review.filter(t=>!t.designer).length} 件尚未指派設計師` : '目前沒有待審工單');
  document.getElementById('s-due').innerHTML = `${over.length}<small>／ ${soon.length}</small>`;
  set('s-due-sub', `另有 ${active.filter(t=>t.dl==='none').length} 件未填截止日`);
  set('s-month-lbl', `${now.getMonth()+1} 月完成（已歸檔）`);
  set('s-month', monthDone.length);
  set('s-month-sub', `電商 ${monthDone.filter(d=>d.src==='電商').length} · 行銷 ${monthDone.filter(d=>d.src==='行銷').length}　|　累計 ${DATA.done.length}`);

  // 警示列
  const unassigned = active.filter(t=>!t.designer && t.review!=='待審核');
  const msgs = [];
  if (over.length) msgs.push(`<a onclick="goTab('due')">⚠ ${over.length} 件已逾期</a>`);
  if (soon.length) msgs.push(`<a onclick="goTab('due')">${soon.length} 件 7 天內到期</a>`);
  if (unassigned.length) msgs.push(`${unassigned.length} 件已核准但未指派設計師`);
  const hotDesigners = DATA.roster.filter(d => utilOf(d).util >= 1).map(d=>d.name);
  if (hotDesigners.length) msgs.push(`${hotDesigners.join('、')} 負載已滿`);
  const ab = document.getElementById('alert-bar');
  ab.style.display = msgs.length ? 'flex' : 'none'; ab.innerHTML = msgs.join('<span>·</span>');

  // demo 提示
  const db = document.getElementById('demo-bar');
  if (demo) { db.style.display='block'; db.textContent = demo; }
  else if (!DATA.config.configured) { db.style.display='block'; db.textContent='試算表尚未建立「設定」分頁，負載計算使用預設值。請在 Apps Script 執行一次 setupV3。'; }
  else db.style.display='none';

  set('load-note', `負載 ＝ 進行中工單點數 ÷ 可用點數（滿載 ${DATA.config.fullLoad} 點 × (1 − 保留%)）｜權重與保留% 在試算表「設定」分頁調整`);

  renderDesigners(); renderDesignerSelect(); renderAll(); renderChecks();
  set('update-time', `資料時間 ${new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}`);
}
function set(id, v){ document.getElementById(id).textContent = v; }

function utilOf(d){
  const mine = DATA.tickets.filter(t => t.isActive && t.designer===d.name);
  const ecP = mine.filter(t=>t.src==='電商').reduce((s,t)=>s+t.weight,0);
  const mkP = mine.filter(t=>t.src==='行銷').reduce((s,t)=>s+t.weight,0);
  const full = Number(DATA.config.fullLoad)||10;
  const avail = full * (1 - Math.min(d.reserve,100)/100);
  return { mine, ecP, mkP, full, avail, util: avail>0 ? (ecP+mkP)/avail : (ecP+mkP>0 ? Infinity : 0) };
}

function renderDesigners(){
  const now = today0();
  document.getElementById('designer-grid').innerHTML = DATA.roster.map(d => {
    const u = utilOf(d), m = u.mine;
    const cnt = s => m.filter(t => (t.exec||'') === s).length;
    const pct = x => Math.max(0, x/u.full*100);
    const resW = Math.min(d.reserve,100), ecW = pct(u.ecP), mkW = pct(u.mkP);
    const overflow = resW+ecW+mkW > 100;
    const scale = overflow ? 100/(resW+ecW+mkW) : 1;
    const uPct = isFinite(u.util) ? Math.round(u.util*100) : 999;
    const uCls = u.util>=1 ? 'c-danger' : u.util>=.75 ? 'c-warn' : 'c-primary';
    const next = m.filter(t=>t.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline))[0];
    let tag;
    if (!m.length) tag = `<span class="dtag t-ok">✓ 目前無進行中工單</span>`;
    else if (!next) tag = `<span class="dtag t-mid">📅 進行中工單皆未填截止日</span>`;
    else { const lv = next.dl==='over'?'t-hot':next.dl==='soon'?'t-mid':'t-ok';
      const rel = next.dleft<0 ? `逾期 ${-next.dleft} 天` : next.dleft===0 ? '今天截止' : `${next.dleft} 天後`;
      tag = `<span class="dtag ${lv}" title="${esc(next.name)}">${next.dl==='over'?'⏰':'📅'} ${rel}｜${esc(next.name)}</span>`; }
    const doneM = DATA.done.filter(x => { const dd=pd(x.doneDate); return x.designer===d.name && dd && dd.getMonth()===now.getMonth() && dd.getFullYear()===now.getFullYear(); }).length;
    return `<div class="dcard ${VIEW.designer===d.name?'on':''}" onclick="pickDesigner('${esc(d.name)}')">
      <div class="dhead">
        <div class="avatar">${esc(d.name.slice(0,1))}</div>
        <div><div class="dname">${esc(d.name)}${d.extra?' <span class="badge b-empty">名單外</span>':''}</div>
          <div class="dmeta">${m.length} 件 · ${fmtPts(u.ecP+u.mkP)} 點${d.reserve?`　保留 ${d.reserve}%`:''}</div></div>
        <div class="util"><div class="util-num ${uCls}">${u.avail>0||!m.length ? (uPct>=999?'—':uPct+'%') : '—'}</div><div class="util-lbl">負載</div></div>
      </div>
      <div class="loadbar ${overflow||u.util>=1?'over':''}" title="保留 ${d.reserve}% · 電商 ${fmtPts(u.ecP)} 點 · 行銷 ${fmtPts(u.mkP)} 點 / 滿載 ${u.full} 點">
        <div class="seg seg-res" style="width:${resW*scale}%"></div>
        <div class="seg seg-ec" style="width:${ecW*scale}%"></div>
        <div class="seg seg-mkt" style="width:${mkW*scale}%"></div>
      </div>
      <div class="drows" style="margin-top:12px">
        <div class="drow"><b>${cnt('製作中')}</b><span>製作中</span></div>
        <div class="drow"><b>${cnt('過稿中')}</b><span>過稿中</span></div>
        <div class="drow"><b>${cnt('待排程')}</b><span>待排程</span></div>
        <div class="drow"><b>${cnt('')}</b><span>未更新</span></div>
      </div>
      ${tag}
      <div class="dfoot"><span>電商 ${fmtPts(u.ecP)} · 行銷 ${fmtPts(u.mkP)} 點</span><span>本月已歸檔 ${doneM} 件</span></div>
    </div>`;
  }).join('');
}

function renderDesignerSelect(){
  const sel = document.getElementById('f-designer');
  const names = DATA.roster.map(d=>d.name);
  sel.innerHTML = `<option value="all">全部設計師</option>` + names.map(n=>`<option ${VIEW.designer===n?'selected':''}>${esc(n)}</option>`).join('') + `<option value="__none" ${VIEW.designer==='__none'?'selected':''}>未指派</option>`;
}

const TABS = [
  ['active','進行中', t=>t.isActive],
  ['電商','電商', t=>t.isActive && t.src==='電商'],
  ['行銷','行銷', t=>t.isActive && t.src==='行銷'],
  ['review','待主管審核', t=>t.review==='待審核' && !t.isDone],
  ['due','逾期／將到期', t=>t.isActive && (t.dl==='over'||t.dl==='soon')],
  ['paused','暫停', t=>t.isPaused],
  ['done','已完稿未歸檔', t=>t.isDone]
];
function baseRows(){
  return DATA.tickets.filter(t => VIEW.designer==='all' || (VIEW.designer==='__none' ? !t.designer : t.designer===VIEW.designer));
}
function renderTabs(){
  const base = baseRows();
  document.getElementById('tabs').innerHTML = TABS.map(([k,l,f]) => {
    const n = base.filter(f).length;
    if (!n && !['active','電商','行銷','review','due'].includes(k)) return '';
    return `<button class="tab ${VIEW.tab===k?'on':''}" onclick="goTab('${k}')">${l}<span class="n">${n}</span></button>`;
  }).join('');
}
function renderTable(){
  const f = (TABS.find(x=>x[0]===VIEW.tab)||TABS[0])[2];
  const q = VIEW.q.toLowerCase();
  let rows = baseRows().filter(f).filter(t => !q || [t.name,t.pos,t.brand,t.id,t.requester,t.note].join(' ').toLowerCase().includes(q));
  rows.sort((a,b) => (a.deadline||'9999') .localeCompare(b.deadline||'9999') || a.src.localeCompare(b.src));
  const tb = document.getElementById('tbody');
  if (!rows.length){ tb.innerHTML = '<tr class="empty"><td colspan="8">沒有符合條件的工單</td></tr>'; return; }
  tb.innerHTML = rows.map(t => {
    const sub = t.src==='電商'
      ? [t.id?`#${t.id}`:'', t.shared?`共用視覺 ${t.shared}`:'', t.type].filter(Boolean).join(' · ')
      : [t.brand, t.type, t.requester?`填單 ${t.requester}`:''].filter(Boolean).join(' · ');
    const rel = t.dleft===null ? '' : t.dleft<0 ? `逾期 ${-t.dleft} 天` : t.dleft===0 ? '今天' : t.dleft<=SOON_DAYS ? `剩 ${t.dleft} 天` : '';
    const dlCell = t.due
      ? `<span class="dl ${t.dl==='over'||t.dl==='soon'? (t.due===t.deadline?t.dl:'') :''}">${md(t.due)}${t.due===t.deadline&&rel?`<span class="rel">${rel}</span>`:''}</span>`
      : '<span class="dl muted">—</span>';
    const wh = t.warehouse ? `<span class="dl2 ${t.warehouse===t.deadline&&t.dl!=='ok'?'dl '+t.dl:''}">入倉 ${md(t.warehouse)}${t.warehouse===t.deadline&&rel?' · '+rel:''}</span>` : '';
    return `<tr class="${t.isActive && t.dl==='over'?'row-over':t.isActive && t.dl==='soon'?'row-soon':''}">
      <td><span class="badge ${t.src==='電商'?'b-ec':'b-mkt'}">${t.src}</span></td>
      <td><div class="tn">${esc(t.name)}</div><div class="ts">${esc(sub)}</div></td>
      <td style="font-size:11.5px;color:var(--text2);max-width:170px">${t.pos?esc(t.pos):'<span class="muted">未填</span>'}</td>
      <td>${t.designer?esc(t.designer):'<span class="muted">未指派</span>'}</td>
      <td>${reviewBadge(t.review)}</td>
      <td>${execBadge(t.exec)}</td>
      <td><span class="dl">${t.eta?md(t.eta):'<span class="muted">—</span>'}</span></td>
      <td>${dlCell}${wh}</td>
    </tr>`;
  }).join('');
}
const reviewBadge = s => `<span class="badge ${{待審核:'b-review',暫停:'b-pause'}[s]||'b-done'}">${esc(s)}</span>`;
const execBadge = s => s ? `<span class="badge ${{待排程:'b-wait',製作中:'b-prog',過稿中:'b-proof',已完稿:'b-done'}[s]||'b-wait'}">${esc(s)}</span>` : '<span class="badge b-empty">未更新</span>';

function renderAll(){ renderTabs(); renderTable(); document.querySelectorAll('.dcard').forEach(()=>{}); }
function goTab(k){ VIEW.tab=k; renderAll(); document.querySelector('.controls').scrollIntoView({behavior:'smooth',block:'start'}); }
function pickDesigner(n){ VIEW.designer = VIEW.designer===n ? 'all' : n; renderDesigners(); renderDesignerSelect(); renderAll(); }

/* ── 資料檢查：列出需要回試算表補填的地方 ── */
function renderChecks(){
  const roster = DATA.config.designers.map(d=>d.name);
  const out = [];
  DATA.tickets.forEach(t => {
    const iss = [];
    if (t.isActive && !t.deadline) iss.push('未填截止日');
    if (t.src==='電商' && t.isActive && !t.pos) iss.push('未填媒體版位');
    if (t.src==='電商' && t.isActive && !t.id) iss.push('未填案件編號');
    if (t.isActive && t.review!=='待審核' && !t.designer) iss.push('已核准未指派');
    if (t.designer && !roster.includes(t.designer)) iss.push(`設計師「${t.designer}」不在名單`);
    if (t.designerRaw && t.designerRaw!==t.designer) iss.push(`設計師寫法「${t.designerRaw}」`);
    if (t.actual && !t.isDone) iss.push('已填實際完成但未改已完稿');
    if (t.isActive && t.review!=='待審核' && !t.exec) iss.push('執行狀態未更新');
    if (t.isDone) iss.push('已完稿，可移到「已完成」');
    if (iss.length) out.push({t, iss});
  });
  const ids = {};
  DATA.tickets.filter(t=>t.src==='電商'&&t.id).forEach(t => (ids[t.id] = ids[t.id]||[]).push(t));
  Object.entries(ids).forEach(([id,arr]) => { if (new Set(arr.map(x=>x.name)).size>1) arr.forEach(t => { const o=out.find(x=>x.t===t); const m=`案件編號 ${id} 重複`; o?o.iss.push(m):out.push({t,iss:[m]}); }); });
  set('check-sum', `資料檢查　${out.length} 筆工單有欄位待補`);
  document.getElementById('check-list').innerHTML = out.length ? out.map(({t,iss}) =>
    `<div class="check-item"><span class="badge ${t.src==='電商'?'b-ec':'b-mkt'}">${t.src}</span><span style="color:var(--text3)">第 ${t.row} 列</span><span>${esc(t.name)}</span><span class="iss">${esc(iss.join('、'))}</span></div>`
  ).join('') : '<div class="check-item"><span></span><span></span><span>都填好了 👍</span><span></span></div>';
}

/* ── 讀取 ── */
let _cd = REFRESH_SEC;
async function refreshData(){
  _cd = REFRESH_SEC;
  const dot = document.getElementById('api-dot'), lbl = document.getElementById('api-label');
  try {
    const res = await fetch(API_URL, {cache:'no-store'});
    const data = await res.json();
    if (data.version !== 3 || !Array.isArray(data.tickets)) throw new Error('old');
    dot.className='api-dot live'; lbl.textContent='即時資料（Sheets 同步）';
    render(data, false);
  } catch(e) {
    dot.className='api-dot'; lbl.textContent = e.message==='old' ? 'API 仍是舊版，顯示示意資料' : '無法連線 API，顯示示意資料';
    if (!DATA || IS_DEMO) render(JSON.parse(JSON.stringify(DEMO)), '目前顯示示意資料（取自 10/19 試算表內容）。Apps Script 換成 v3 並重新部署後會自動切換為即時資料。');
  }
}
setInterval(() => { _cd--; document.getElementById('countdown').textContent = `· ${Math.floor(_cd/60)}:${String(_cd%60).padStart(2,'0')} 後更新`; if (_cd<=0) refreshData(); }, 1000);
window.addEventListener('DOMContentLoaded', refreshData);
</script>
